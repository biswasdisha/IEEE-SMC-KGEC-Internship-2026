<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Pneumonia Detector</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{{ url_for('home') }}">Home</a>
          <a class="nav-link" href="{{ url_for('about') }}">About</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="result-card card shadow-lg border-0 p-4">
        <div class="row g-4 align-items-center">
          <div class="col-lg-6">
            <img src="{{ image_url }}" alt="Uploaded chest X-ray" class="img-fluid rounded-4 shadow-sm" />
          </div>
          <div class="col-lg-6">
            <h2 class="fw-bold mb-3">Prediction Result</h2>
            <div class="p-4 rounded-4 result-box">
              <p class="mb-2 text-uppercase fw-semibold text-muted">Prediction</p>
              <h3 class="display-6 fw-bold">{{ prediction }}</h3>
              <p class="mt-3 mb-0 text-uppercase fw-semibold text-muted">Confidence</p>
              <h4 class="fw-bold">{{ confidence }}%</h4>
            </div>
            <div class="mt-4 d-flex flex-wrap gap-3">
              <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">Back</a>
              <a href="{{ url_for('home') }}" class="btn btn-primary">Upload Another Image</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
